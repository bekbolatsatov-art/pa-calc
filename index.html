const KEY = 'pa_key_' + D.salt;   // a new build (new salt or password) forgets the old key
async function open(raw) {
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, k, u8(D.data)));
  // document.open() is ignored while the loader is still parsing, so wait for load
  if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
  document.open(); document.write(html); document.close();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);

  const f = document.getElementById('f'); f.hidden = false;
  f.onsubmit = async ev => {
